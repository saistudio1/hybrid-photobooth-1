<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Camera body -->
  <rect x="96" y="160" width="320" height="230" rx="36" fill="#ffffff" opacity="0.95"/>
  <rect x="180" y="120" width="152" height="48" rx="16" fill="#ffffff" opacity="0.95"/>
  <!-- Lens outer ring -->
  <circle cx="256" cy="275" r="76" fill="url(#lensGrad)"/>
  <circle cx="256" cy="275" r="58" fill="#2e2e38"/>
  <circle cx="256" cy="275" r="42" fill="#0f0f14"/>
  <!-- Lens reflection -->
  <circle cx="242" cy="260" r="14" fill="#ffffff" opacity="0.45"/>
  <!-- Flash & small led -->
  <circle cx="360" cy="205" r="14" fill="#f43f5e"/>
  <circle cx="150" cy="205" r="8" fill="#38bdf8"/>
  <!-- Brand text -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SAI STUDIO</text>
</svg>
